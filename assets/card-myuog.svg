<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="MyUOG — Official University of Gujrat App">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#fff" stroke-opacity="0.03" stroke-width="1"/></pattern>
  <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#60a5fa" stop-opacity=".22"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
  <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa" stop-opacity=".9"/><stop offset="100%" stop-color="#60a5fa" stop-opacity=".45"/></linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#d4d4d4"/></linearGradient>
  <clipPath id="r"><rect width="600" height="250" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="600" height="250" fill="#0a0a0a"/>
  <rect width="600" height="250" fill="url(#grid)"/>
  <ellipse cx="540" cy="-20" rx="300" ry="170" fill="url(#g)"/>
  <rect x="28" y="28" width="40" height="40" rx="11" fill="#171717" stroke="#262626"/>
  <text x="48" y="55" text-anchor="middle" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="url(#mk)">UG</text>
  <text x="572" y="48" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="12.5" fill="#737373">Core Lead App Developer  ·  10K+ installs</text>
  <text x="28" y="94" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="-.6" fill="url(#tg)">MyUOG — Official University of Gujrat App</text>
  <text x="28" y="118" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14.5" fill="#a3a3a3">Official campus app for students, faculty and applicants: results, attendance,</text><text x="28" y="140" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14.5" fill="#a3a3a3">fees, live bus tracking, admissions and push notifications.</text>
  <rect x="28" y="194" width="166" height="26" rx="13" fill="#0a0a0a" stroke="#262626"/><text x="111.0" y="211" text-anchor="middle" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#d4d4d4">Kotlin Multiplatform</text><rect x="202" y="194" width="130" height="26" rx="13" fill="#0a0a0a" stroke="#262626"/><text x="267.0" y="211" text-anchor="middle" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#d4d4d4">Jetpack Compose</text><rect x="340" y="194" width="45" height="26" rx="13" fill="#0a0a0a" stroke="#262626"/><text x="362.5" y="211" text-anchor="middle" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#d4d4d4">PHP</text><rect x="393" y="194" width="81" height="26" rx="13" fill="#0a0a0a" stroke="#262626"/><text x="433.5" y="211" text-anchor="middle" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#d4d4d4">Firebase</text>
  <text x="572" y="213" text-anchor="end" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#737373">Google Play →</text>
</g>
<rect x=".5" y=".5" width="599" height="249" rx="18" fill="none" stroke="#262626"/>
</svg>